<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time — neuroncalc</title>
<meta name="description" content="Click the box the moment it turns green. Measures pure visual reflex.">
<link rel="stylesheet" href="/tests/style.css">
</head>
<body>
<nav class="top-bar">
  <a href="/" class="brand">NEURON<span>CALC</span></a>
  <div class="nav-right">
    <a href="/neuron-metrics" class="back-link">← All metrics</a>
    <a href="/insights" class="nav-link">Insights</a>
  </div>
</nav>

<header class="module-head">
  <div class="eyebrow">Neuron Metrics</div>
  <h1>Reaction Time</h1>
  <p>Click the box the moment it turns green. Measures pure visual reflex.</p>
</header>

<main class="stage">
  <div id="game-mount"></div>
</main>

<footer class="footer">© 2026 neuroncalc</footer>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">Result</div>
    <div class="score-display"><span id="score-val">0</span><span id="score-unit" class="unit">ms</span></div>
    <div class="data-grid">
      <div class="data-item"><div class="label">Best</div><div class="value" id="res-best">—</div></div>
      <div class="data-item"><div class="label">Average</div><div class="value" id="res-avg">—</div></div>
      <div class="data-item"><div class="label">Attempts</div><div class="value" id="res-count">0</div></div>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="btn-retry">Retry</button>
      <a class="btn secondary" href="/neuron-metrics">Back</a>
    </div>
  </div>
</div>

<script src="/tests/core.js"></script>
<script>App.run('reaction');</script>
</body>
</html>
