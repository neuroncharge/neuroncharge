<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insights</title>
<meta name="description" content="Your best scores and recent activity across modules.">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="0.1.png">

</head>
<body>
<nav class="top-bar">
  <a href="index.html" class="brand">NEURONCHARGE</a>
  <div class="nav-right">
    <a href="neuron-metrics.html" class="nav-link">Metrics</a>
    <a href="universal-calcs.html" class="nav-link">Calcs</a>
    <a href="calm-space.html" class="nav-link">Calm</a>
    <a href="insights.html" class="nav-link on">Insights</a>
  </div>
</nav><header class="module-head" style="max-width: 1100px;">
  <div class="eyebrow">Insights</div>
  <h1>Insights</h1>
  <p>Your best scores and accumulated focus, pulled live from this device.</p>
</header>
<section class="section">
  <div class="stat-grid">
    <div class="stat"><div class="lbl">Modules tried</div><div class="val" id="stat-tried">—</div></div>
    <div class="stat"><div class="lbl">Total attempts</div><div class="val" id="stat-attempts">—</div></div>
    <div class="stat"><div class="lbl">Focus this week</div><div class="val" id="stat-focus">—</div></div>
    <div class="stat"><div class="lbl">Top module</div><div class="val" id="stat-top">—</div></div>
  </div>
  <div class="table-wrap">
    <div class="table-head"><span class="lbl">Neuron metrics</span><button class="reset" id="reset-btn">Reset all →</button></div>
    <table>
      <thead><tr><th>Module</th><th class="r">Best</th><th class="r">Avg</th><th class="r">Tries</th></tr></thead>
      <tbody id="ins-rows"></tbody>
    </table>
  </div>
</section>

<footer class="footer" style="display: flex; justify-content: center; gap: 1.5rem; align-items: center;">
  <span>© 2026 neuroncharge</span>
  <a href="privacy.html" style="text-decoration: underline; text-underline-offset: 4px;">Privacy Policy</a>
</footer>
<script src="app.js" defer></script>
</body>
