<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus</title>
<meta name="description" content="Intentional focus timer.">
<link rel="stylesheet" href="../style.css">
<link rel="icon" type="image/png" href="../0.1.png">

</head>
<body>
<nav class="top-bar">
  <a href="../index.html" class="brand">NEURONCHARGE</a>
  <div class="nav-right">
    <a href="../neuron-metrics.html" class="nav-link">Metrics</a>
    <a href="../universal-calcs.html" class="nav-link">Calcs</a>
    <a href="../calm-space.html" class="nav-link">Calm</a>
    <a href="../insights.html" class="nav-link">Insights</a>
  </div>
</nav><header class="module-head">
  <div class="eyebrow">Calm · Focus</div>
  <h1>Intentional Focus Timer</h1>
  <p>Name your objective, set a countdown, and let the page hold you accountable.</p>
</header>
<section class="section">
  <div class="center-card">
    <input id="obj" class="timer-input" placeholder="What are you focusing on?" maxlength="25">
    <div class="timer-display" id="display">25:00</div>
    <div id="obj-echo" class="eyebrow" style="margin-bottom:1.5rem;display:none;"></div>
    <div class="preset-row" id="presets">
      <button data-m="15">15m</button><button data-m="25" class="on">25m</button>
      <button data-m="45">45m</button><button data-m="60">60m</button><button data-m="90">90m</button>
    </div>
    <div class="custom-min-row">
      <label for="custom-min">Custom</label>
      <input id="custom-min" class="custom-min" type="number" inputmode="numeric"
             min="1" max="480" step="1" placeholder="min">
      <span class="footer-dim" style="font-size:.75rem;">1–480 min</span>
      <div id="custom-err" class="custom-min-err" aria-live="polite"></div>
    </div>
    <button id="toggle" class="btn primary">Begin focus</button>
  </div>
</section>

<footer class="footer" style="display: flex; justify-content: center; gap: 1.5rem; align-items: center;">
  <span>© 2026 neuroncharge</span>
  <a href="../privacy.html" style="text-decoration: underline; text-underline-offset: 4px;">Privacy Policy</a>
</footer>
<script src="../app.js" defer></script>
</body>
</html>
