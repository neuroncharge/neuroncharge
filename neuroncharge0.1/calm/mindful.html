<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindful</title>
<meta name="description" content="Weekly focus metrics.">
<link rel="stylesheet" href="../style.css">
<link rel="icon" type="image/png" href="../0.1.png">

</head>
<body>
<nav class="top-bar">
  <a href="../index.html" class="brand">NEURONCHARGE</a>
  <div class="nav-right">
    <a href="../neuron-metrics.html" class="nav-link">Metrics</a>
    <a href="../universal-calcs.html" class="nav-link">Calcs</a>
    <a href="../calm-space.html" class="nav-link">Calm</a>
    <a href="../insights.html" class="nav-link">Insights</a>
  </div>
</nav><header class="module-head">
  <div class="eyebrow">Calm · Mindful</div>
  <h1>Mindful Metrics</h1>
  <p>A quiet record of your focus minutes this week.</p>
</header>
<section class="section">
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);max-width:600px;">
    <div class="stat"><div class="lbl">This week</div><div class="val" id="m-total">0m</div></div>
    <div class="stat"><div class="lbl">Sessions</div><div class="val" id="m-count">0</div></div>
    <div class="stat"><div class="lbl">Avg / session</div><div class="val" id="m-avg">—</div></div>
  </div>
  <div class="panel" style="margin-top:1.5rem; width: 500px;">
    <div class="lbl" style="font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:1rem;">Last 7 days</div>
    <div class="bar-chart" id="bars"></div>
  </div>
  <div class="panel" style="margin-top:1.5rem; width: 500px;">
    <div class="lbl" style="font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:.5rem;">Recent sessions</div>
    <ul class="list" id="recent"></ul>
  </div>
</section>


<footer class="footer" style="display: flex; justify-content: center; gap: 1.5rem; align-items: center;">
  <span>© 2026 neuroncharge</span>
  <a href="../privacy.html" style="text-decoration: underline; text-underline-offset: 4px;">Privacy Policy</a>
</footer>
<script src="../app.js" defer></script>
</body>
</html>
