</nav><header class="module-head">
  <div class="eyebrow">Accounts</div>
  <h1>Compound Interest</h1>
  <p>Project savings growth with optional monthly contributions.</p>
</header>
<section class="calc-wrap split">
  <div>
    <div class="field"><div class="lbl">Principal </div><input type="number" id="p" value="10000"></div>
    <div class="field"><div class="lbl">Annual rate (%)</div><input type="number" id="r" value="7"></div>
    <div class="field"><div class="lbl">Years</div><input type="number" id="t" value="10"></div>
    <div class="field"><div class="lbl">Compounds / year</div>
      <select id="n"><option value="1">Annually (1)</option><option value="4">Quarterly (4)</option><option value="12" selected>Monthly (12)</option><option value="365">Daily (365)</option></select>
    </div>
    <div class="field"><div class="lbl">Monthly contribution </div><input type="number" id="c" value="200"></div>
  </div>
  <div class="panel">
    <div class="out"><div class="lbl">Future value</div><div class="val" id="o-fv">—</div></div>
    <div class="out"><div class="lbl">Principal</div><div class="val" id="o-p">—</div></div>
    <div class="out"><div class="lbl">Contributions</div><div class="val" id="o-c">—</div></div>
    <div class="out"><div class="lbl">Interest earned</div><div class="val" id="o-i">—</div></div>
  </div>
</section>
